<div class="home-container">
  <app-head-bar></app-head-bar>
  <app-search-bar 
    (searchByTitle)="onSearchByTitle($event)"
    (searchByYear)="onSearchByYear($event)"
    (resetSearch)="onResetSearch()"
  ></app-search-bar>

  <div *ngIf="loading" class="loading">
    <p>Chargement des livres...</p>
  </div>

  <div *ngIf="error" class="error">
    <p>{{ error }}</p>
    <button (click)="loadBooks()" class="btn-retry">Réessayer</button>
  </div>

  <app-book-list 
    *ngIf="!loading && !error"
    [books]="filteredBooks"
    (bookSelected)="onBookSelected($event)"
  ></app-book-list>
</div>
