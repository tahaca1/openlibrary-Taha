<div class="search-container">
  <div class="container">
    <div class="search-card">
      <div class="row g-0 align-items-center">
        <!-- Search by Title -->
        <div class="col-lg-5 position-relative border-end-lg">
          <div class="p-3">
            <label for="title" class="form-label text-uppercase small fw-bold text-muted mb-1">Titre du livre</label>
            <div class="input-group input-group-flush">
              <span class="input-group-text bg-transparent border-0 ps-0 text-primary"><i
                  class="bi bi-search fs-5"></i></span>
              <input id="title" type="text"
                class="form-control border-0 bg-transparent shadow-none fs-5 fw-medium text-dark"
                [(ngModel)]="searchTitle" placeholder="Ex: Harry Potter..." (keyup.enter)="onSearchTitle()" />
            </div>
          </div>
        </div>

        <!-- Search by Year -->
        <div class="col-lg-4 position-relative border-end-lg">
          <div class="p-3">
            <label for="year" class="form-label text-uppercase small fw-bold text-muted mb-1">Année</label>
            <div class="input-group input-group-flush">
              <span class="input-group-text bg-transparent border-0 ps-0 text-primary"><i
                  class="bi bi-calendar-event fs-5"></i></span>
              <input id="year" type="number"
                class="form-control border-0 bg-transparent shadow-none fs-5 fw-medium text-dark"
                [(ngModel)]="searchYear" placeholder="Ex: 2023" (keyup.enter)="onSearchYear()" />
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="col-lg-3">
          <div class="p-3 d-flex gap-2">
            <button (click)="onSearchTitle(); onSearchYear()"
              class="btn btn-primary btn-lg flex-grow-1 rounded-pill shadow-sm">
              <span class="d-none d-xl-inline">Rechercher</span>
              <i class="bi bi-arrow-right d-xl-none"></i>
            </button>
            <button (click)="onReset()" class="btn btn-light btn-lg rounded-circle" title="Réinitialiser">
              <i class="bi bi-arrow-counterclockwise text-muted"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
