<div class="book-list-container pb-5">
  <div class="container">
    <div *ngIf="books.length === 0" class="alert alert-info text-center shadow-sm" role="alert">
      Aucun livre trouvé. Veuillez charger les livres ou affiner votre recherche.
    </div>

    <div *ngIf="books.length > 0" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
      <div *ngFor="let book of books" class="col">
        <div class="card h-100 shadow-sm book-card hover-shadow transition" (click)="onBookClick(book)"
          style="cursor: pointer;">
          <div class="ratio ratio-2x3 bg-light border-bottom">
            <img *ngIf="book.cover_id" [src]="getCoverImageUrl(book.cover_id)" [alt]="book.title"
              class="card-img-top object-fit-cover" (error)="$event.target.src='assets/no-cover.png'" />
            <div *ngIf="!book.cover_id" class="d-flex align-items-center justify-content-center text-muted">
              <span>Pas de couverture</span>
            </div>
          </div>
          <div class="card-body d-flex flex-column">
            <h5 class="card-title text-truncate" [title]="book.title">{{ book.title }}</h5>
            <p *ngIf="book.subtitle" class="card-text small text-muted text-truncate mb-2">{{ book.subtitle }}</p>
            <div class="mt-auto">
              <div class="d-flex justify-content-between align-items-center small">
                <span class="badge bg-light text-dark border">{{ book.first_publish_year }}</span>
                <span class="text-muted">{{ book.edition_count }} éd.</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
