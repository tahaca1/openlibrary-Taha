<div class="book-details-container bg-main">
  <div class="container py-5">
    <button class="btn-back d-flex align-items-center gap-2 mb-4" (click)="goBack()">
      <i class="bi bi-arrow-left"></i> Retour
    </button>

    <!-- Skeleton Loader -->
    <div *ngIf="loading" class="row">
      <div class="col-md-4 mb-4">
        <div class="skeleton skeleton-cover"></div>
      </div>
      <div class="col-md-8">
        <div class="skeleton skeleton-title mb-3"></div>
        <div class="skeleton skeleton-text w-50 mb-4"></div>
        <div class="d-flex gap-4 mb-5">
          <div class="skeleton skeleton-meta"></div>
          <div class="skeleton skeleton-meta"></div>
        </div>
        <div class="skeleton skeleton-text mb-2"></div>
        <div class="skeleton skeleton-text mb-2"></div>
        <div class="skeleton skeleton-text mb-2"></div>
        <div class="skeleton skeleton-text w-75"></div>
      </div>
    </div>

    <!-- Error State -->
    <div *ngIf="error" class="alert alert-danger text-center shadow-sm" role="alert">
      <i class="bi bi-exclamation-triangle me-2"></i> {{ error }}
    </div>

    <!-- Content -->
    <div *ngIf="book && !loading" class="book-details-card animate-fade-in">
      <div class="row g-0">
        <!-- Cover Section -->
        <div
          class="col-md-5 col-lg-4 bg-light d-flex align-items-center justify-content-center p-4 p-lg-5 book-cover-wrapper">
          <img *ngIf="book.cover_id" [src]="getCoverImageUrl(book.cover_id)" [alt]="book.title"
            class="img-fluid rounded shadow-lg book-cover" (error)="$event.target.src='assets/no-cover.png'" />
          <div *ngIf="!book.cover_id"
            class="no-cover d-flex flex-column align-items-center justify-content-center text-muted p-5 rounded">
            <i class="bi bi-book fs-1 mb-3"></i>
            <span class="text-center">Pas de couverture</span>
          </div>
        </div>

        <!-- Info Section -->
        <div class="col-md-7 col-lg-8 p-4 p-lg-5">
          <h1 class="display-5 fw-bold text-primary-dark font-heading mb-2">{{ book.title }}</h1>
          <p *ngIf="book.subtitle" class="lead text-muted fst-italic mb-4">{{ book.subtitle }}</p>

          <div class="d-flex gap-5 border-top border-bottom py-3 mb-4">
            <div>
              <small class="text-uppercase text-muted fw-bold d-block mb-1">Année</small>
              <span class="fs-4 fw-bold text-dark">{{ book.first_publish_year || 'N/A' }}</span>
            </div>
            <div>
              <small class="text-uppercase text-muted fw-bold d-block mb-1">Éditions</small>
              <span class="fs-4 fw-bold text-dark">{{ book.edition_count || 'N/A' }}</span>
            </div>
          </div>

          <div class="mb-4">
            <h3 class="h5 fw-bold mb-3">Description</h3>
            <p class="text-secondary lh-lg" *ngIf="book.description">{{ book.description }}</p>
            <p class="text-muted fst-italic" *ngIf="!book.description">Aucune description disponible pour ce livre.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
