<div class="book-details-container">
  <div class="container">
    <button class="btn-back" (click)="goBack()">← Retour à la liste</button>

    <div *ngIf="loading" class="loading">
      <p>Chargement des détails du livre...</p>
    </div>

    <div *ngIf="error" class="error">
      <p>{{ error }}</p>
    </div>

    <div *ngIf="book && !loading" class="book-details">
      <div class="book-details-content">
        <div class="book-cover-section">
          <img 
            *ngIf="book.cover_id" 
            [src]="getCoverImageUrl(book.cover_id)" 
            [alt]="book.title"
            class="cover-image"
            (error)="$event.target.src='assets/no-cover.png'"
          />
          <div *ngIf="!book.cover_id" class="no-cover">
            <p>Pas de couverture disponible</p>
          </div>
        </div>

        <div class="book-info-section">
          <h1 class="book-title">{{ book.title }}</h1>
          
          <p *ngIf="book.subtitle" class="book-subtitle">{{ book.subtitle }}</p>

          <div class="book-meta">
            <div class="meta-item">
              <span class="meta-label">Année de publication :</span>
              <span class="meta-value">{{ book.first_publish_year }}</span>
            </div>
            <div class="meta-item">
              <span class="meta-label">Nombre d'éditions :</span>
              <span class="meta-value">{{ book.edition_count }}</span>
            </div>
          </div>

          <div *ngIf="book.description" class="book-description">
            <h2>Description</h2>
            <p>{{ book.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
