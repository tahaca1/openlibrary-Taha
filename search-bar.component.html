<div class="search-bar">
  <div class="container">
    <div class="search-form">
      <div class="search-group">
        <label for="title">Rechercher par titre</label>
        <div class="input-group">
          <input 
            id="title"
            type="text" 
            [(ngModel)]="searchTitle" 
            placeholder="Entrez un titre..."
            (keyup.enter)="onSearchTitle()"
          />
          <button (click)="onSearchTitle()" class="btn-search">Chercher</button>
        </div>
      </div>

      <div class="search-group">
        <label for="year">Rechercher par année</label>
        <div class="input-group">
          <input 
            id="year"
            type="number" 
            [(ngModel)]="searchYear" 
            placeholder="Année de publication..."
            (keyup.enter)="onSearchYear()"
          />
          <button (click)="onSearchYear()" class="btn-search">Chercher</button>
        </div>
      </div>

      <button (click)="onReset()" class="btn-reset">Réinitialiser</button>
    </div>
  </div>
</div>
